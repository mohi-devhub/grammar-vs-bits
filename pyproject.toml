[project]
name = "grammar-vs-bits"
version = "0.1.3"
description = "Grammar vs Bits: tool-call format contracts and weight precision in small language models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "modal==1.6.2",
  "jsonschema==4.26.0",
  "jinja2==3.1.6",
  "numpy==2.5.4",
  "safetensors==0.8.0",
  "huggingface-hub==2.3.0",
  "transformers==5.21.0",
  "torch==2.14.1; sys_platform == 'linux'",
  "sentencepiece==0.2.1",
  "protobuf==6.33.5",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
]

[dependency-groups]
analysis = [
    "matplotlib==3.11.2",
]
build = ["cmake==4.4.4", "ninja==1.13.2"]

[tool.uv]
package = false
index-url = "https://pypi.org/simple"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
